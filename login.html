<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOON - Iniciar Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --beige-light: #FAF5EF;
            --beige: #F0E6D8;
            --beige-dark: #E0D0BC;
            --cafe-light: #8B6F47;
            --cafe: #6B4F32;
            --cafe-dark: #4A3520;
            --cafe-accent: #A0784C;
            --blanco: #FFFFFF;
            --texto: #3A2D1F;
            --texto-light: #6B5D4E;
            --error: #c0392b;
            --error-bg: #fdecea;
            --success: #27ae60;
            --success-bg: #d5f5e3;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--beige) 0%, var(--beige-light) 50%, var(--beige-dark) 100%);
            color: var(--texto);
        }

        h1, h2, h3 { font-family: 'Playfair Display', serif; }

        .auth-container {
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        .auth-card {
            background: var(--blanco);
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(74,53,32,0.15);
            overflow: hidden;
        }

        .auth-header {
            background: var(--cafe-dark);
            padding: 35px 30px;
            text-align: center;
            color: var(--blanco);
        }

        .auth-header .logo {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--beige);
        }

        .auth-header h1 {
            font-size: 2rem;
            letter-spacing: 4px;
            margin-bottom: 5px;
        }

        .auth-header p {
            color: var(--beige-dark);
            font-size: 0.9rem;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 2px solid var(--beige);
        }

        .auth-tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            background: var(--beige-light);
            border: none;
            color: var(--texto-light);
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
        }

        .auth-tab.active {
            background: var(--blanco);
            color: var(--cafe-dark);
            border-bottom: 3px solid var(--cafe);
        }

        .auth-tab:hover:not(.active) {
            background: var(--beige);
        }

        .auth-body {
            padding: 30px;
        }

        .auth-form { display: none; }
        .auth-form.active { display: block; }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--cafe-dark);
            margin-bottom: 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--cafe-accent);
            font-size: 0.95rem;
        }

        .input-wrapper input {
            width: 100%;
            padding: 13px 15px 13px 42px;
            border: 2px solid var(--beige-dark);
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            background: var(--beige-light);
            color: var(--texto);
            transition: border-color 0.3s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--cafe);
            background: var(--blanco);
        }

        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--cafe-accent);
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-auth {
            width: 100%;
            padding: 14px;
            background: var(--cafe);
            color: var(--blanco);
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.5px;
            margin-top: 5px;
        }

        .btn-auth:hover {
            background: var(--cafe-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(74,53,32,0.3);
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            display: none;
            align-items: center;
            gap: 10px;
        }

        .alert.error {
            background: var(--error-bg);
            color: var(--error);
            border: 1px solid #f5c6cb;
            display: flex;
        }

        .alert.success {
            background: var(--success-bg);
            color: var(--success);
            border: 1px solid #a3dfbf;
            display: flex;
        }

        .auth-footer {
            text-align: center;
            padding: 20px 30px 25px;
            border-top: 1px solid var(--beige);
        }

        .auth-footer a {
            color: var(--cafe);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--cafe);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .back-link:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            .auth-container { padding: 15px; }
            .auth-body { padding: 20px; }
            .auth-header { padding: 25px 20px; }
            .auth-header h1 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo"><i class="fas fa-moon"></i></div>
                <h1>MOON</h1>
                <p>Aprende idiomas con tecnología</p>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" data-form="login">
                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                </button>
                <button class="auth-tab" data-form="register">
                    <i class="fas fa-user-plus"></i> Registrarse
                </button>
            </div>

            <div class="auth-body">
                <!-- Alertas -->
                <div class="alert" id="alertBox">
                    <i class="fas fa-info-circle"></i>
                    <span id="alertText"></span>
                </div>

                <!-- Login -->
                <form class="auth-form active" id="loginForm">
                    <div class="form-group">
                        <label>Correo Electrónico</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="loginEmail" placeholder="correo@ejemplo.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="loginPassword" placeholder="Tu contraseña" required>
                            <button type="button" class="toggle-password" onclick="togglePass('loginPassword', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn-auth">
                        <i class="fas fa-sign-in-alt"></i> Ingresar
                    </button>
                </form>

                <!-- Register -->
                <form class="auth-form" id="registerForm">
                    <div class="form-group">
                        <label>Nombre Completo</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user"></i>
                            <input type="text" id="regName" placeholder="Tu nombre completo" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Correo Electrónico</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="regEmail" placeholder="correo@ejemplo.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="regPassword" placeholder="Mínimo 6 caracteres" required minlength="6">
                            <button type="button" class="toggle-password" onclick="togglePass('regPassword', this)">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Confirmar Contraseña</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="regPassword2" placeholder="Repite tu contraseña" required minlength="6">
                        </div>
                    </div>
                    <button type="submit" class="btn-auth">
                        <i class="fas fa-user-plus"></i> Crear Cuenta
                    </button>
                </form>
            </div>

            <div class="auth-footer">
                <a href="index.html"><i class="fas fa-arrow-left"></i> Volver al sitio principal</a>
            </div>
        </div>
    </div>

    <script>
        // Tabs
        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
                tab.classList.add('active');
                const formId = tab.dataset.form === 'login' ? 'loginForm' : 'registerForm';
                document.getElementById(formId).classList.add('active');
                hideAlert();
            });
        });

        function showAlert(msg, type) {
            const box = document.getElementById('alertBox');
            const text = document.getElementById('alertText');
            box.className = 'alert ' + type;
            box.querySelector('i').className = type === 'error' ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
            text.textContent = msg;
        }

        function hideAlert() {
            document.getElementById('alertBox').className = 'alert';
        }

        function togglePass(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // Registro
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const pass = document.getElementById('regPassword').value;
            const pass2 = document.getElementById('regPassword2').value;

            if (pass !== pass2) {
                showAlert('Las contraseñas no coinciden.', 'error');
                return;
            }

            let users = JSON.parse(localStorage.getItem('moonUsers') || '[]');
            if (users.find(u => u.email === email)) {
                showAlert('Ya existe una cuenta con ese correo.', 'error');
                return;
            }

            users.push({
                name, email, password: pass,
                progress: {
                    english: { level: 1, lessons: {} },
                    italian: { level: 1, lessons: {} }
                }
            });
            localStorage.setItem('moonUsers', JSON.stringify(users));
            showAlert('¡Cuenta creada! Ahora puedes iniciar sesión.', 'success');
            document.getElementById('registerForm').reset();

            setTimeout(() => {
                document.querySelector('[data-form="login"]').click();
            }, 1500);
        });

        // Login
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const pass = document.getElementById('loginPassword').value;

            let users = JSON.parse(localStorage.getItem('moonUsers') || '[]');
            const user = users.find(u => u.email === email && u.password === pass);

            if (!user) {
                showAlert('Correo o contraseña incorrectos.', 'error');
                return;
            }

            localStorage.setItem('moonCurrentUser', JSON.stringify(user));
            showAlert('¡Bienvenido, ' + user.name + '!', 'success');
            setTimeout(() => {
                window.location.href = 'plataforma.html';
            }, 1000);
        });

        // Si ya hay sesión activa, ir a plataforma
        if (localStorage.getItem('moonCurrentUser')) {
            window.location.href = 'plataforma.html';
        }
    </script>
</body>
</html>
